<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FukraGamer</title>
    <!-- Heavy Bold Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0f212e; /* Stake Dark Blue */
            --accent-green: #00e701;
            --text-main: #ffffff;
        }

        /* --- PRELOADER (DITTO STAKE STYLE) --- */
        .preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOutScreen 0.5s ease-in-out 2.5s forwards;
        }

        .container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .brand {
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -1.5px;
            opacity: 0;
            transform: scale(0.9);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
        }

        .dot { color: var(--accent-green); }

        /* Stars (Sparkles) */
        .star {
            position: absolute;
            color: var(--text-main);
            font-size: 20px;
            opacity: 0;
            animation: sparklePop 0.5s ease-out forwards;
        }
        /* Star positions */
        .star-1 { top: -20px; left: 10px; animation-delay: 0.6s; }
        .star-2 { top: -10px; right: -20px; animation-delay: 0.8s; }
        .star-3 { bottom: -10px; left: -20px; animation-delay: 1s; }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes sparklePop {
            0% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        @keyframes fadeOutScreen {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- Main Content (Hidden until load) --- */
        body { background-color: var(--bg-main); margin: 0; font-family: sans-serif; }
    </style>
</head>
<body>

    <div class="preloader">
        <div class="container">
            <span class="star star-1">✦</span>
            <span class="star star-2">✦</span>
            <span class="star star-3">✦</span>
            <div class="brand">FukraGamer<span class="dot">.</span></div>
        </div>
    </div>

    <!-- Your Website Content -->
    <div style="color: white; padding: 50px;">
        <h1>Website Content Here</h1>
    </div>

</body>
</html>
